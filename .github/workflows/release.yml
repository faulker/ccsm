name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Calculate next version
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump }}
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          VERSION="${LATEST_TAG#v}"
          # Strip any pre-release or build metadata (e.g. 1.2.3-alpha.1+build)
          VERSION="${VERSION%%-*}"
          VERSION="${VERSION%%+*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping $LATEST_TAG -> $NEW_TAG ($BUMP_TYPE)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.toml version and lockfile
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          set -e
          VERSION="${NEW_TAG#v}"
          sed -i '0,/^version = ".*"/s//version = "'"${VERSION}"'"/' Cargo.toml
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${VERSION}"
          git push origin HEAD:main

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          set -e
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, skipping creation"
            exit 0
          fi
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: [resolve-version]
    if: always() && (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.new_tag || github.ref_name }}
      # Apple signing inputs. Lifted into env so the macOS-only steps can test
      # for them in `if:` conditions; when they're unset the build still runs and
      # simply ships unsigned binaries, so forks and first-time runs work.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macOS x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set version in Cargo.toml (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' -e '0,/^version = ".*"/s//version = "'"${VERSION}"'"/' Cargo.toml
          else
            sed -i -e '0,/^version = ".*"/s//version = "'"${VERSION}"'"/' Cargo.toml
          fi

      - name: Set version in Cargo.toml (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $content = Get-Content Cargo.toml -Raw
          $content = $content -replace '(?m)(^\[package\][\s\S]*?^version\s*=\s*)"[^"]*"', "`$1`"$version`""
          Set-Content Cargo.toml $content

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Signing happens between build and packaging, so the archive (and the
      # checksums computed from it in the release job) covers the signed binary.
      # The self-updater verifies those checksums, so the two must not diverge.
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          # A throwaway keychain, unlocked for this job only, keeps the key out of
          # the runner's login keychain and makes cleanup a single delete.
          KEYCHAIN="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security import "$CERT" \
            -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -f pkcs12
          rm -f "$CERT"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put it at the front of the search list, keeping the existing entries,
          # so certificate chains still resolve for anything else in the job.
          EXISTING=()
          while IFS= read -r line; do
            entry="$(printf '%s' "$line" | tr -d '"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$entry" ] && EXISTING+=("$entry")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign binary
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/ccsm"
          # Hardened runtime and a secure timestamp are both required for the
          # signature to be accepted by notarization.
          codesign --force \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN" \
            --options runtime \
            --timestamp \
            "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      # Signing alone still leaves Gatekeeper unhappy about a binary downloaded
      # through a browser; notarization is what clears that. `notarytool` only
      # takes zip/pkg/dmg, so the binary is zipped just for submission. A bare
      # executable can't have the ticket stapled to it, so nothing is copied
      # back: Gatekeeper looks the ticket up online by the signature's hash.
      - name: Notarize binary
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_NOTARY_KEY != ''
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$APPLE_NOTARY_KEY" | base64 --decode > "$KEY"
          ZIP="$RUNNER_TEMP/ccsm-notarize.zip"
          # No --keepParent: the source is a single executable, not a bundle.
          ditto -c -k "target/${{ matrix.target }}/release/ccsm" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --timeout 30m
          rm -f "$KEY" "$ZIP"

      - name: Report signing status
        if: runner.os == 'macOS'
        run: |
          if [ -n "${APPLE_CERTIFICATE_P12:-}" ]; then
            codesign --display --verbose=2 "target/${{ matrix.target }}/release/ccsm" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "APPLE_CERTIFICATE_P12 is not set: ${{ matrix.target }} is unsigned." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Runs even when an earlier step failed, so a signing key never outlives
      # the job that used it.
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        run: security delete-keychain "$KEYCHAIN" || true

      - name: Package binary (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "ccsm-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" ccsm
          mv "ccsm-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" "$GITHUB_WORKSPACE/"

      - name: Package binary (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/ccsm.exe" -DestinationPath "ccsm-$env:RELEASE_TAG-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccsm-${{ matrix.target }}
          path: ccsm-${{ env.RELEASE_TAG }}-${{ matrix.target }}.*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [resolve-version, build]
    if: always() && needs.build.result == 'success'
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.new_tag || github.ref_name }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          shasum -a 256 * > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/*
